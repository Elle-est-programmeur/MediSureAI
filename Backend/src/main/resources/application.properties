spring.application.name=ragdemo
spring.config.import=optional:file:.env[.properties],optional:file:./Backend/.env[.properties]

# === JWT Configuration ===
jwt.secret.key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Access token: 15 minutes
jwt.access.expiration=3600000
# Refresh token: 7 days
jwt.refresh.expiration=604800000

# === HYBRID SRLM: GROQ (Cloud Critique, OpenAI-compatible) ===
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.max-tokens=500
# OpenAI embeddings disabled locally to save costs/latency
spring.ai.openai.embedding.enabled=false

# === HYBRID SRLM: OLLAMA (Local Foundation) ===
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:1b
spring.ai.ollama.embedding.options.model=nomic-embed-text
# Enable Ollama for local tasks
spring.ai.ollama.chat.enabled=true
spring.ai.ollama.embedding.enabled=true

# === Vector DB (PgVector - RESET TO 768 dims) ===
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# === Structured DB (local) ===
spring.datasource.url=jdbc:postgresql://localhost:5433/medsureai
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Shreyas@sept12}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# === MongoDB Configuration ===
spring.data.mongodb.uri=mongodb://localhost:27017/medisure_documents
spring.data.mongodb.auto-index-creation=true

# === RabbitMQ Configuration ===
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# === Document Processing Configuration ===
document.upload.directory=${user.home}/medisure-ai/uploads
document.upload.allowed-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword
document.chunking.max-chunk-size=500
document.chunking.overlap=50

# === RabbitMQ Queue Configuration ===
rabbitmq.queue.document-processing=document.processing.queue
rabbitmq.exchange.document=document.exchange
rabbitmq.routing-key.document-processing=document.processing.routingkey

# === Agent & SRLM Spec Configuration ===
srlm.reasoning.paths=2
spring.ai.ollama.chat.options.timeout=120s
spring.ai.ollama.embedding.options.timeout=60s
srlm.reasoning.temperature=0.7
srlm.reflection.enabled=true
srlm.scoring.min-confidence=6.0
srlm.synthesis.enabled=true
srlm.reasoning.max-tokens=400

# Phase 6 Enhancements
srlm.feedback.enabled=true
srlm.feedback.confidence-threshold=6.0
safety.min-confidence=4.0
session.memory.max-queries=10

# === Legacy Placeholder Mapping ===
openai.model.completion=llama-3.3-70b-versatile
openai.model.embedding=nomic-embed-text
vector.faiss.index-path=${user.home}/medisure-ai/faiss-index
vector.faiss.dimension=768
vector.search.top-k=5
vector.search.similarity-threshold=0.7

logging.level.org.springframework.ai.vectorstore=DEBUG
logging.level.com.example.Backend=INFO
