# === Structured DB (local) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/medsureai
spring.datasource.username=$USER_NAME
spring.datasource.password=$PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update


# Performance optimizations
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# === MongoDB Configuration ===
spring.data.mongodb.uri=mongodb://localhost:27017/medisure_documents
spring.data.mongodb.auto-index-creation=true

# === RabbitMQ Configuration ===
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# === Document Processing Configuration ===
document.upload.directory=${user.home}/medisure-ai/uploads
document.upload.allowed-types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword
document.chunking.max-chunk-size=500
document.chunking.overlap=50

# === RabbitMQ Queue Configuration ===
rabbitmq.queue.document-processing=document.processing.queue
rabbitmq.exchange.document=document.exchange
rabbitmq.routing-key.document-processing=document.processing.routingkey

# === OpenAI Configuration ===
openai.api.key=${OPENAI_API_KEY:sk-proj-your-key-here}
openai.model.embedding=text-embedding-3-small
openai.model.completion=gpt-4o-mini
openai.model.temperature=0.3
openai.model.max-tokens=1000
openai.timeout=60000

# === Agent Configuration ===
agent.intent.confidence-threshold=0.7
agent.max-planning-steps=5
agent.context.max-chunks=5

# === Vector Database (FAISS in-memory + file persistence) ===
vector.faiss.index-path=${user.home}/medisure-ai/faiss-index
vector.faiss.dimension=1536
vector.search.top-k=5
vector.search.similarity-threshold=0.7

# === Embedding Batch Processing ===
embedding.batch-size=100
embedding.retry-attempts=3
embedding.retry-delay=2000

# === SRLM Configuration ===
srlm.reasoning.paths=3
srlm.reasoning.temperature=0.7
srlm.reflection.enabled=true
srlm.scoring.min-confidence=6.0
srlm.synthesis.enabled=true

logging.level.org.springframework.ai.vectorstore=DEBUG
logging.level.com.example.Backend=INFO

# === Tool Orchestration ===
tools.vector-search.enabled=true
tools.metadata-query.enabled=true

# === Confidence Calibration ===
confidence.min-threshold=4.0
confidence.high-threshold=7.0

# === SRLM Feedback Loop ===
srlm.feedback.enabled=true
srlm.feedback.confidence-threshold=6.0

# === Guardrails ===
safety.hallucination-detection=true
safety.min-confidence=4.0

# === Session Memory ===
session.memory.enabled=true
session.memory.max-queries=10
session.memory.ttl-minutes=60
